global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Mode A (root compose, KANONIK) — scrape lewat DNS ws-net.
# Catatan: `host.docker.internal` tidak dapat menjangkau port yang di-publish
# pada Docker rootless (koneksi ditolak), jadi target langsung ke service name.
scrape_configs:
  - job_name: 'go-backend'
    static_configs:
      - targets: ['arxiv-go-backend:8080']
    metrics_path: '/metrics'

  - job_name: 'python-ml'
    static_configs:
      - targets: ['arxiv-python-ml:8001']
    metrics_path: '/metrics'

  - job_name: 'mcp-gateway'
    static_configs:
      - targets: ['mcp-gateway:8090']
    metrics_path: '/metrics'

  - job_name: 'llm-eval-framework'
    static_configs:
      - targets: ['llm-eval-framework:8002']
    metrics_path: '/metrics'

  - job_name: 'rag-api'
    static_configs:
      - targets: ['rag-api:8000']
    metrics_path: '/metrics'
