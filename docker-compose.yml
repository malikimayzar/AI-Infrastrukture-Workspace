# Workspace-level docker-compose for the AI Infrastructure Platform
#
# Brings up all 4 services plus shared infrastructure:
#   arxiv-research-assistant  (go-backend :8080, python-ml :8001)
#   mcp-gateway              (:8090)
#   llm-eval-framework       (:8002)
#   rag-research             (:8000)
#
# Shared infrastructure (defined once, used by all services):
#   postgres :5432, qdrant :6333, ollama :11434, redis :6379,
#   prometheus :9090, grafana :3000
#
# Usage:
#   docker compose up -d          # start everything
#   docker compose up -d arxiv-go-backend arxiv-python-ml  # start subset
#   docker compose down           # stop everything
#
# Prerequisites:
#   cp .env.example .env   # then edit .env as needed

# Rootless docker's UDP DNS is flaky on this host; force glibc to use TCP (use-vc).
# Shared via anchors by every service that resolves external hosts.
x-dns: &dns-map
  dns: ["1.1.1.1", "8.8.8.8"]
  dns_opt: ["use-vc"]
services:
  # ───────────────────────── Shared infrastructure ─────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: ws-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arxiv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arxiv_secret}
      POSTGRES_DB: ${POSTGRES_DB:-arxiv_db}
    ports:
      - "5432:5432"
    volumes:
      - ws-postgres_data:/var/lib/postgresql/data
      - ./arxiv-research-assistant/infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arxiv} -d ${POSTGRES_DB:-arxiv_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ws-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ws-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ws-qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant/qdrant ships no curl/wget; probe the port with bash instead.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ws-net

  redis:
    image: redis:7-alpine
    container_name: ws-redis
    profiles: ["monitoring"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ws-net

  ollama:
    image: ollama/ollama:latest
    container_name: ws-ollama
    <<: *dns-map
    ports:
      # Host 11434 is occupied by a host-side Ollama daemon; expose the container on 11435.
      # In-stack services still use http://ollama:11434 (the compose network alias).
      - "11435:11434"
    volumes:
      - ws-ollama_data:/root/.ollama
    environment:
      # Keep loaded models warm — a cold phi3:mini load on CPU takes ~2.5 min.
      OLLAMA_KEEP_ALIVE: 30m
    healthcheck:
      # ollama/ollama ships no curl/wget; probe the port with bash instead.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/11434'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ws-net

  prometheus:
    image: prom/prometheus:latest
    container_name: ws-prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ws-prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - ws-net

  grafana:
    image: grafana/grafana:latest
    container_name: ws-grafana
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ws-grafana_data:/var/lib/grafana
    networks:
      - ws-net

  # ───────────────────── arxiv-research-assistant ──────────────────────────

  arxiv-python-ml:
    build:
      context: ./arxiv-research-assistant/python-ml
      dockerfile: Dockerfile
    container_name: ws-arxiv-python-ml
    <<: *dns-map
    ports:
      - "8001:8001"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-arxiv}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-arxiv_secret}
      DB_NAME: ${POSTGRES_DB:-arxiv_db}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      # Host RAM (~15GB) tanpa swap: load phi3:mini (~4.5GB peak) OOM ketika
      # desktop GUI ikut berjalan. Rute Groq dipakai sebagai seksi utama
      # (kunci valid, ~2-5s); phi3 tetap tersedia untuk demo lokal ketika
      # host memori longgar — set LLM_PROVIDER=ollama di .env untuk rute lokal.
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      # The full MiniLM snapshot (shared with rag-research) is mounted read-only,
      # so the embedder never needs outbound DNS.
      HF_HUB_OFFLINE: "1"
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      # python:slim ships no curl/wget — use urllib instead. MiniLM downloads from
      # HF Hub on first boot; give it a generous start period.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    networks:
      - ws-net

  arxiv-go-backend:
    build:
      context: ./arxiv-research-assistant/go-backend
      dockerfile: Dockerfile
    container_name: ws-arxiv-go-backend
    <<: *dns-map
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-arxiv}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-arxiv_secret}
      DB_NAME: ${POSTGRES_DB:-arxiv_db}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://arxiv-python-ml:8001}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    depends_on:
      postgres:
        condition: service_healthy
      arxiv-python-ml:
        condition: service_healthy
    healthcheck:
      # wget localhost resolves to ::1 while Fiber binds 0.0.0.0 (IPv4) — use the loopback IPv4 explicitly.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ws-net

  # ───────────────────────── llm-eval-framework ────────────────────────────

  llm-eval-framework:
    build:
      context: ./llm-eval-framework
      dockerfile: Dockerfile
    container_name: ws-llm-eval-framework
    <<: *dns-map
    ports:
      - "8002:8002"
    volumes:
      # Keep eval artifacts and checkpoints, which are otherwise lost on rebuild.
      - ./llm-eval-framework/reports:/app/reports
      - ./llm-eval-framework/logs:/app/logs
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      # python:3.11-slim ships no curl/wget — use urllib instead.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ws-net

  # ──────────────────────────── mcp-gateway ────────────────────────────────

  mcp-gateway:
    build:
      context: ./mcp-gateway
      dockerfile: Dockerfile
    container_name: ws-mcp-gateway
    <<: *dns-map
    ports:
      - "8090:8090"
    environment:
      POSTGRES_DSN: host=ws-postgres port=5432 user=${POSTGRES_USER:-arxiv} password=${POSTGRES_PASSWORD:-arxiv_secret} dbname=${POSTGRES_DB:-arxiv_db} sslmode=disable
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ARXIV_SERVICE_URL: ${ARXIV_SERVICE_URL:-http://arxiv-go-backend:8080}
      EVAL_SERVICE_URL: ${EVAL_SERVICE_URL:-http://llm-eval-framework:8002}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-http://rag-api:8000}
      GATEWAY_LISTEN_ADDRESS: ${GATEWAY_LISTEN_ADDRESS:-:8090}
    depends_on:
      arxiv-go-backend:
        condition: service_healthy
      llm-eval-framework:
        condition: service_healthy
      rag-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ws-net

  # ──────────────────────────── rag-research ───────────────────────────────

  rag-api:
    build:
      context: ./rag-research
      dockerfile: Dockerfile
    container_name: ws-rag-api
    <<: *dns-map
    ports:
      - "8000:8000"
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Optional response cache. Redis is only started by the monitoring
      # profile, so keep this off by default and point it at the compose DNS
      # name when enabled (`make monitoring-up` + REDIS_ENABLED=true).
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      # Base python-slim ships no curl/wget — probe with urllib. The MiniLM
      # snapshot is baked into the image, so startup needs no outbound DNS.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    networks:
      - ws-net

networks:
  ws-net:
    driver: bridge

volumes:
  ws-postgres_data:
  ws-qdrant_data:
  ws-ollama_data:
  ws-prometheus_data:
  ws-grafana_data:
