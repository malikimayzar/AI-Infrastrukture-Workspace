# Workspace-level docker-compose for the AI Infrastructure Platform
#
# Brings up all 4 services plus shared infrastructure:
#   arxiv-research-assistant  (go-backend :8080, python-ml :8001)
#   mcp-gateway              (:8090)
#   llm-eval-framework       (:8002)
#   rag-research             (:8000)
#
# Shared infrastructure (defined once, used by all services):
#   postgres :5432, qdrant :6333, ollama :11434, redis :6379,
#   prometheus :9090, grafana :3000
#
# Usage:
#   docker compose up -d          # start everything
#   docker compose up -d arxiv-go-backend arxiv-python-ml  # start subset
#   docker compose down           # stop everything
#
# Prerequisites:
#   cp .env.example .env   # then edit .env as needed

services:
  # ───────────────────────── Shared infrastructure ─────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: ws-postgres
    environment:
      POSTGRES_USER: arxiv
      POSTGRES_PASSWORD: arxiv_secret
      POSTGRES_DB: arxiv_db
    ports:
      - "5432:5432"
    volumes:
      - ws-postgres_data:/var/lib/postgresql/data
      - ./arxiv-research-assistant/infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arxiv -d arxiv_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ws-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ws-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ws-qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ws-net

  redis:
    image: redis:7-alpine
    container_name: ws-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ws-net

  ollama:
    image: ollama/ollama:latest
    container_name: ws-ollama
    ports:
      - "11434:11434"
    volumes:
      - ws-ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ws-net

  prometheus:
    image: prom/prometheus:latest
    container_name: ws-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./arxiv-research-assistant/infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ws-prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - ws-net

  grafana:
    image: grafana/grafana:latest
    container_name: ws-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - ws-grafana_data:/var/lib/grafana
    networks:
      - ws-net

  # ───────────────────── arxiv-research-assistant ──────────────────────────

  arxiv-python-ml:
    build:
      context: ./arxiv-research-assistant/python-ml
      dockerfile: Dockerfile
    container_name: ws-arxiv-python-ml
    ports:
      - "8001:8001"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: arxiv
      DB_PASSWORD: arxiv_secret
      DB_NAME: arxiv_db
      QDRANT_URL: http://qdrant:6333
      OLLAMA_HOST: http://ollama:11434
      LLM_PROVIDER: ollama
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ws-net

  arxiv-go-backend:
    build:
      context: ./arxiv-research-assistant/go-backend
      dockerfile: Dockerfile
    container_name: ws-arxiv-go-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: arxiv
      DB_PASSWORD: arxiv_secret
      DB_NAME: arxiv_db
      ML_SERVICE_URL: http://arxiv-python-ml:8001
      QDRANT_URL: http://qdrant:6333
      LLM_PROVIDER: ollama
      GROQ_MODEL: openai/gpt-oss-20b
    depends_on:
      postgres:
        condition: service_healthy
      arxiv-python-ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ws-net

  # ───────────────────────── llm-eval-framework ────────────────────────────

  llm-eval-framework:
    build:
      context: ./llm-eval-framework
      dockerfile: Dockerfile
    container_name: ws-llm-eval-framework
    ports:
      - "8002:8002"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ws-net

  # ──────────────────────────── mcp-gateway ────────────────────────────────

  mcp-gateway:
    build:
      context: ./mcp-gateway
      dockerfile: Dockerfile
    container_name: ws-mcp-gateway
    ports:
      - "8090:8090"
    environment:
      POSTGRES_DSN: host=ws-postgres port=5432 user=arxiv password=arxiv_secret dbname=arxiv_db sslmode=disable
      GROQ_MODEL: openai/gpt-oss-20b
      ARXIV_SERVICE_URL: http://arxiv-go-backend:8080
      EVAL_SERVICE_URL: http://llm-eval-framework:8002
      RAG_SERVICE_URL: http://rag-api:8000
      GATEWAY_LISTEN_ADDRESS: :8090
    depends_on:
      arxiv-go-backend:
        condition: service_healthy
      llm-eval-framework:
        condition: service_healthy
      rag-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ws-net

  # ──────────────────────────── rag-research ───────────────────────────────

  rag-api:
    build:
      context: ./rag-research
      dockerfile: Dockerfile
    container_name: ws-rag-api
    ports:
      - "8000:8000"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      QDRANT_URL: http://qdrant:6333
      OLLAMA_HOST: http://ollama:11434
      GROQ_MODEL: openai/gpt-oss-20b
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ws-net

networks:
  ws-net:
    driver: bridge

volumes:
  ws-postgres_data:
  ws-qdrant_data:
  ws-ollama_data:
  ws-prometheus_data:
  ws-grafana_data:
